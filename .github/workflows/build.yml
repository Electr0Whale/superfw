name: Build SuperFW

on:
  push:
    branches: [wqy10pt-font]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4

      - name: Fix git ownership (Docker)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate fonts
        run: |
          python3 res/fonts/bdf_to_pack.py \
            --bdf wenquanyi_10pt.bdf \
            --font-blocks ascii,latin,latin-a,latin-b,gen-punct,greek,cyrilic,shapes,cjk-sym,cjk-compat,hiragana,katakana,fullwidth,cjk-uni,hangul \
            --output res/fonts.pack
          python3 res/fonts/bdf_to_pack.py \
            --bdf wenquanyi_10pt.bdf \
            --font-blocks ascii,shapes \
            --output /tmp/embed.pack
          python3 res/fonts/pack_to_carray.py /tmp/embed.pack > src/fonts/font_embed.h
          cp res/fonts.pack res/fonts-ext.pack

      - name: Build Chis (hardware)
        run: |
          git submodule update --init apultra
          make -j$(nproc) BOARD=chis BUNDLE_GBC_EMULATOR=0 BUNDLE_OTHER_EMULATORS=0
          mkdir -p out && cp superfw.gba out/superfw-chis.gba

      - name: Build Chis (emulator)
        run: |
          rm -f superfw.gba *.elf *.payload *.map
          make -j$(nproc) BOARD=chis NO_SD_MODE=1 BUNDLE_GBC_EMULATOR=0 BUNDLE_OTHER_EMULATORS=0
          cp superfw.gba out/superfw-emu.gba

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superfw-chis
          path: out/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: CI Build ${{ github.sha }}
          tag_name: ci-${{ github.run_number }}
          files: out/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
